<h2><app-icon name="users" [size]="24"></app-icon> Utilisateurs</h2>

<button class="btn-primary" (click)="toggleForm()">
  <app-icon [name]="showForm ? 'close' : 'plus'" [size]="18"></app-icon>
  <span>{{ showForm ? 'Annuler' : 'Nouvel utilisateur' }}</span>
</button>

<form *ngIf="showForm" (ngSubmit)="creer()" class="form">
  <input [(ngModel)]="novo.username" name="username" placeholder="Username *" required />
  <input [(ngModel)]="novo.password" name="password" type="password" placeholder="Mot de passe *" required />
  <input [(ngModel)]="novo.name" name="name" placeholder="Nom complet *" required />
  <input [(ngModel)]="novo.email" name="email" type="email" placeholder="Email *" required />

  <select [(ngModel)]="novo.role" name="role" required>
    <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
  </select>

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Création...' : 'Créer' }}
  </button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>
<p *ngIf="success" class="success">{{ success }}</p>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Nom</th>
      <th>Email</th>
      <th>Rôle</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of usuarios">
      <td>{{ u.id }}</td>
      <td><strong>{{ u.username }}</strong></td>
      <td>{{ u.name }}</td>
      <td>{{ u.email }}</td>
      <td>
        <span class="role-pill" [style.background]="getRoleColor(u.role)">
          {{ u.role }}
        </span>
      </td>
      <td>
        <button (click)="excluir(u)">Supprimer</button>
      </td>
    </tr>
    <tr *ngIf="usuarios.length === 0">
      <td colspan="6" style="text-align:center; padding:32px;">Aucun utilisateur</td>
    </tr>
  </tbody>
</table>
