<h2><app-icon name="box" [size]="24"></app-icon> Produits</h2>

<form (ngSubmit)="salvar()" class="form">
  <input [(ngModel)]="novo.name" name="name" placeholder="Nom *" required />
  <input [(ngModel)]="novo.description" name="description" placeholder="Description" />
  <input [(ngModel)]="novo.price" name="price" type="number" step="0.01" placeholder="Prix *" required />
  <input [(ngModel)]="novo.availableQuantity" name="availableQuantity" type="number" placeholder="Quantité *" required />

  <select [(ngModel)]="categoriaId" name="categoryId" required>
    <option [ngValue]="null">-- Catégorie --</option>
    <option *ngFor="let c of categorias" [ngValue]="c.id">{{ c.name }}</option>
  </select>

  <select [(ngModel)]="fornecedorId" name="supplierId">
    <option [ngValue]="null">-- Fournisseur --</option>
    <option *ngFor="let f of fornecedores" [ngValue]="f.id">{{ f.name }}</option>
  </select>

  <button type="submit">{{ editandoId ? 'Mettre à jour' : 'Ajouter' }}</button>
  <button type="button" *ngIf="editandoId" (click)="cancelar()">Annuler</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>Prix</th><th>Stock</th><th>Catégorie</th><th>Fournisseur</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of produtos">
      <td>{{ p.id }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.price | number:'1.2-2' }}</td>
      <td>{{ p.availableQuantity }}</td>
      <td>{{ p.categoryName }}</td>
      <td>{{ p.supplierName }}</td>
      <td>
        <button (click)="editar(p)">Éditer</button>
        <button (click)="excluir(p.id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
