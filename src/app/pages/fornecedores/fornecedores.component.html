<h2><app-icon name="truck" [size]="24"></app-icon> Fournisseurs</h2>

<form (ngSubmit)="salvar()" class="form">
  <input [(ngModel)]="novo.name" name="name" placeholder="Nom *" required />
  <input [(ngModel)]="novo.registrationNumber" name="registrationNumber" placeholder="N° enregistrement" />
  <input [(ngModel)]="novo.phone" name="phone" placeholder="Téléphone" />
  <input [(ngModel)]="novo.email" name="email" type="email" placeholder="Email" />
  <button type="submit">{{ editandoId ? 'Mettre à jour' : 'Ajouter' }}</button>
  <button type="button" *ngIf="editandoId" (click)="cancelar()">Annuler</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>N° enreg.</th><th>Tél</th><th>Email</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let f of fornecedores">
      <td>{{ f.id }}</td>
      <td>{{ f.name }}</td>
      <td>{{ f.registrationNumber }}</td>
      <td>{{ f.phone }}</td>
      <td>{{ f.email }}</td>
      <td>
        <button (click)="editar(f)">Éditer</button>
        <button (click)="excluir(f.id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
