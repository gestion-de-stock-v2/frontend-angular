<h2><app-icon name="swap" [size]="24"></app-icon> Mouvements de stock</h2>

<form class="form">
  <label>Produit
    <select [(ngModel)]="produtoSelecionadoId" name="productId" (ngModelChange)="carregar()">
      <option *ngFor="let p of produtos" [ngValue]="p.id">
        {{ p.name }} — stock : {{ p.availableQuantity }}
      </option>
    </select>
  </label>
</form>

<form (ngSubmit)="salvar()" class="form">
  <label>Type
    <select [(ngModel)]="novo.type" name="type">
      <option value="ENTRY">Entrée</option>
      <option value="EXIT">Sortie</option>
    </select>
  </label>
  <label>Quantité
    <input [(ngModel)]="novo.quantity" name="quantity" type="number" min="1" />
  </label>
  <label>Observation
    <input [(ngModel)]="novo.note" name="note" />
  </label>
  <button type="submit"><app-icon name="check" [size]="16"></app-icon> Enregistrer</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Type</th><th>Quantité</th><th>Observation</th><th>Date</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let m of movimentacoes">
      <td>{{ m.id }}</td>
      <td>
        <span class="badge" [class.entrada]="m.type === 'ENTRY'" [class.saida]="m.type === 'EXIT'">
          {{ m.type === 'ENTRY' ? 'Entrée' : 'Sortie' }}
        </span>
      </td>
      <td>{{ m.quantity }}</td>
      <td>{{ m.note }}</td>
      <td>{{ m.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
    </tr>
    <tr *ngIf="movimentacoes.length === 0">
      <td colspan="5" style="text-align:center;color:#9CA3AF;padding:32px">Aucun mouvement</td>
    </tr>
  </tbody>
</table>
