<h2><app-icon name="tag" [size]="24"></app-icon> Catégories</h2>

<form (ngSubmit)="salvar()" class="form">
  <input [(ngModel)]="nova.name" name="name" placeholder="Nom *" required />
  <input [(ngModel)]="nova.description" name="description" placeholder="Description" />
  <button type="submit">{{ editandoId ? 'Mettre à jour' : 'Ajouter' }}</button>
  <button type="button" *ngIf="editandoId" (click)="cancelar()">Annuler</button>
</form>

<p *ngIf="erro" class="erro">{{ erro }}</p>

<table class="table">
  <thead>
    <tr><th>ID</th><th>Nom</th><th>Description</th><th>Actions</th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let c of categorias">
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.description }}</td>
      <td>
        <button (click)="editar(c)">Éditer</button>
        <button (click)="excluir(c.id)">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
